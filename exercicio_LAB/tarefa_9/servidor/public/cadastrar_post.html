<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar post</title>
    <link rel="stylesheet" href="cadastrar.css">
</head>
<body>
    <div class="container">
<form action="/salvar_post" method="POST">
    <label for="titulo">Título:</label>
    <input type="text" id="titulo" name="titulo" placeholder="Post" required>

    <label for="resumo">Resumo:</label>
    <input type="text" id="resumo" name="resumo" placeholder="Faça um pequeno resumo do post" required>

    <label for="conteudo">Conteúdo:</label>
    <input type="text" id="conteudo" name="conteudo" placeholder="Digite algum texto" required>

    <button type="submit" class="btn-submit">Enviar</button>
</form>


</body>
</html>
